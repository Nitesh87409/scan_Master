name: Play Store Auto-Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'scan_master_app/**'
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store Track'
        required: true
        default: 'production'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

jobs:
  deploy:
    name: Deploy to Google Play
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Flutter dependencies
        working-directory: ./scan_master_app
        run: flutter pub get

      - name: Setup Keystore
        working-directory: ./scan_master_app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo $KEYSTORE_BASE64 | base64 --decode > android/app/upload-keystore.jks
          echo "storePassword=$KEYSTORE_PASSWORD" > android/key.properties
          echo "keyPassword=$KEYSTORE_PASSWORD" >> android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - name: Free Disk Space, Add Swap & Accept Licenses
        run: |
          # Free up disk space
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true
          
          # Add 8GB Swap Space to prevent OOM during llvm-strip of massive ML Kit libraries
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          
          # Accept licenses and install NDK 26.1.10909125 (Flutter's default for stable)
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125" || true

      - name: Build Android App Bundle (AAB)
        working-directory: ./scan_master_app
        run: |
          # Stop gradle daemon to free up memory before the heavy build and fix watch-fs locks
          pkill -f '.*GradleDaemon.*' || true
          sed -i '/org.gradle.java.home/d' android/gradle.properties
          sed -i '/org.gradle.unsafe.watch-fs/d' android/gradle.properties
          echo "org.gradle.unsafe.watch-fs=false" >> android/gradle.properties
          flutter build appbundle --release --obfuscate --split-debug-info=build/app/debug-info
          echo "org.gradle.unsafe.watch-fs=false" >> android/gradle.properties
          flutter build appbundle --release --obfuscate --split-debug-info=build/app/debug-info

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ./scan_master_app/android

      - name: Deploy to Play Store (Fastlane)
        working-directory: ./scan_master_app/android
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
          PLAY_STORE_TRACK: ${{ inputs.track || 'production' }}
        run: |
          echo "$PLAY_STORE_JSON_KEY" > play_store_key.json
          export PLAY_STORE_JSON_KEY_PATH="play_store_key.json"
          bundle install
          bundle exec fastlane deploy
          rm play_store_key.json

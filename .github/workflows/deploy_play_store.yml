name: Play Store Auto-Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'scan_master_app/**'
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store Track'
        required: true
        default: 'production'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

jobs:
  deploy:
    name: Deploy to Google Play
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Flutter dependencies
        working-directory: ./scan_master_app
        run: flutter pub get

      - name: Setup Keystore
        working-directory: ./scan_master_app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo $KEYSTORE_BASE64 | base64 --decode > android/app/upload-keystore.jks
          echo "storePassword=$KEYSTORE_PASSWORD" > android/key.properties
          echo "keyPassword=$KEYSTORE_PASSWORD" >> android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - name: Android NDK Diagnostics + Install
        run: |
          echo "=== ANDROID_HOME: $ANDROID_HOME ==="
          echo "=== Pre-installed NDKs: ===" && ls $ANDROID_HOME/ndk/ 2>/dev/null || echo "none"
          echo "=== Flutter version: ===" && flutter --version
          echo "=== Installing NDK 27.0.12077973 via sdkmanager ==="
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" 2>&1 | tail -3
          echo "=== NDKs after install: ===" && ls $ANDROID_HOME/ndk/ 2>/dev/null
          echo "=== Strip binary exists: ===" && ls $ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip 2>/dev/null || echo "NOT FOUND"

      - name: Build Android App Bundle (AAB)
        working-directory: ./scan_master_app
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.0.12077973
        run: |
          sed -i '/org.gradle.java.home/d' android/gradle.properties
          sed -i '/org.gradle.unsafe.watch-fs/d' android/gradle.properties
          echo "org.gradle.unsafe.watch-fs=false" >> android/gradle.properties
          flutter build appbundle --release --split-debug-info=build/app/debug-info

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ./scan_master_app/android

      - name: Deploy to Play Store (Fastlane)
        working-directory: ./scan_master_app/android
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
          PLAY_STORE_TRACK: ${{ inputs.track || 'production' }}
        run: |
          echo "$PLAY_STORE_JSON_KEY" > play_store_key.json
          export PLAY_STORE_JSON_KEY_PATH="play_store_key.json"
          bundle install
          bundle exec fastlane deploy
          rm play_store_key.json
